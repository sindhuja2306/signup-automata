<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Automation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🤖 Signup Automation</h1>

    <div class="card">
      <h2>🎯 Control Panel</h2>
      <div class="input-group">
        <input type="text" id="referralCode" placeholder="Referral Code" class="input-field">
        <input type="number" id="targetSignups" value="1000" class="input-field" min="1">
        <input type="text" id="startPhone" value="5000000001" class="input-field" placeholder="Start Phone">
      </div>
      <div class="button-group">
        <button id="startBtn" class="btn btn-primary">🚀 Start</button>
        <button id="stopBtn" class="btn btn-danger" style="display:none;">⏹️ Stop</button>
        <button id="clearBtn" class="btn btn-secondary">🗑️ Clear Logs</button>
        <button id="clearResultsBtn" class="btn btn-secondary">📊 Clear Results</button>
      </div>
    </div>

    <div class="card">
      <h2>📊 Statistics</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Status</span>
          <span id="status" class="stat-value status-idle">Idle</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Referral</span>
          <span id="currentReferral" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Successful</span>
          <span id="successful" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Failed</span>
          <span id="failed" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Current Phone</span>
          <span id="currentPhone" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Progress</span>
          <span id="progressText" class="stat-value">0%</span>
        </div>
      </div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
      </div>
    </div>

    <div class="card">
      <h2>📝 Activity Log</h2>
      <div id="logContainer" class="log-container">
        <div class="log-entry info">💡 System ready</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
